name: Perso mobile pages one-shot
on:
  push:
    paths:
      - '.github/workflows/perso-mobile-pages-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Perso PNG export for mobile readability
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('services/personnel_v2.py')
          text = service.read_text(encoding='utf-8')
          marker = '    @staticmethod\n    def png_bytes(title: str, rows) -> bytes:\n'
          if 'def png_pages(' not in text:
              insert = '''    @staticmethod\n    def png_pages(title: str, rows, per_page: int = 6) -> list[bytes]:\n        """Split the PNG export into short landscape pages for Discord mobile.\n\n        Discord scales very tall attachments down aggressively in chat previews.\n        Keeping each page to at most six staff cards preserves the intentionally\n        large typography instead of shrinking one giant image.\n        """\n        rows = list(rows)\n        if not rows:\n            return [PersonnelService.png_bytes(title, [])]\n        per_page = max(1, min(6, int(per_page)))\n        pages = []\n        total_pages = (len(rows) + per_page - 1) // per_page\n        for page_index in range(total_pages):\n            start = page_index * per_page\n            chunk = rows[start:start + per_page]\n            page_title = title if total_pages == 1 else f"{title} • {page_index + 1}/{total_pages}"\n            pages.append(PersonnelService.png_bytes(page_title, chunk))\n        return pages\n\n'''
              if marker not in text:
                  raise SystemExit('png_bytes marker not found')
              text = text.replace(marker, insert + marker, 1)
              service.write_text(text, encoding='utf-8')

          cog = Path('cogs/management/personnel_stats.py')
          c = cog.read_text(encoding='utf-8')
          old = '''        else:\n            data=self.service.png_bytes("MD Personalabteilung • Statistik",rows); file=discord.File(BytesIO(data),filename="perso-statistik.png")\n        await interaction.followup.send(file=file,ephemeral=True)\n'''
          new = '''        else:\n            pages=self.service.png_pages("MD Personalabteilung • Statistik",rows,per_page=6)\n            files=[discord.File(BytesIO(data),filename=f"perso-statistik-{i+1}.png") for i,data in enumerate(pages[:10])]\n            await interaction.followup.send(files=files,ephemeral=True)\n            return\n        await interaction.followup.send(file=file,ephemeral=True)\n'''
          if old not in c:
              raise SystemExit('export block marker not found')
          c = c.replace(old, new, 1)
          cog.write_text(c, encoding='utf-8')
          PY
      - name: Validate Python
        run: python -m compileall -q services/personnel_v2.py cogs/management/personnel_stats.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/personnel_v2.py cogs/management/personnel_stats.py
          git commit -m 'fix: keep Perso exports readable on Discord mobile'
          git push origin main
