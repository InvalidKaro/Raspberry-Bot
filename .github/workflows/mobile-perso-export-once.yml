name: Mobile Perso Export Once

on:
  push:
    paths:
      - '.github/workflows/mobile-perso-export-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace personnel PNG renderer with mobile-first layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('services/personnel_v2.py')
          s = p.read_text(encoding='utf-8')
          marker = '    @staticmethod\n    def png_bytes(title:str, rows) -> bytes:\n'
          head = s.split(marker, 1)[0]
          fn = '''    @staticmethod
    def png_bytes(title:str, rows) -> bytes:
        # Mobile-first rendering only. Existing personnel DB rows are never changed here.
        rows = list(rows)

        width = 860
        margin = 36
        header_h = 390
        row_h = 224
        footer_h = 96
        height = header_h + max(1, len(rows)) * row_h + footer_h

        bg = (17, 19, 24)
        panel = (26, 29, 36)
        panel_alt = (30, 33, 41)
        track = (43, 47, 57)
        text = (241, 243, 247)
        muted = (165, 171, 184)
        accent_e = (91, 110, 245)
        accent_b = (71, 201, 145)
        accent_total = (245, 184, 72)

        image = Image.new("RGB", (width, height), bg)
        draw = ImageDraw.Draw(image)

        title_font = PersonnelService._font(52, bold=True)
        subtitle_font = PersonnelService._font(27)
        card_label_font = PersonnelService._font(25, bold=True)
        card_value_font = PersonnelService._font(42, bold=True)
        name_font = PersonnelService._font(35, bold=True)
        meta_font = PersonnelService._font(23)
        bar_label_font = PersonnelService._font(25, bold=True)
        activity_font = PersonnelService._font(29, bold=True)
        footer_font = PersonnelService._font(20)

        total_e = sum(int(r["inductions"]) for r in rows)
        total_b = sum(int(r["bwg"]) for r in rows)
        total_activity = total_e + total_b
        top = rows[0] if rows else None

        draw.text((margin, 30), title, font=title_font, fill=text)
        draw.text((margin, 95), f"{len(rows)} Mitarbeitende • gespeicherte Perso-Daten", font=subtitle_font, fill=muted)

        gap = 16
        card_w = (width - margin * 2 - gap) // 2
        card_h = 112
        cards = [
            ("EINWEISUNGEN", str(total_e), accent_e),
            ("BWG", str(total_b), accent_b),
            ("GESAMTAKTIVITÄT", str(total_activity), accent_total),
            ("TOP ACTIVITY", str(top["display_name"]) if top else "—", text),
        ]
        for i, (label, value, accent) in enumerate(cards):
            col = i % 2
            row = i // 2
            x = margin + col * (card_w + gap)
            y = 145 + row * (card_h + gap)
            draw.rounded_rectangle((x, y, x + card_w, y + card_h), radius=18, fill=panel)
            draw.rounded_rectangle((x, y, x + 6, y + card_h), radius=3, fill=accent)
            draw.text((x + 20, y + 14), label, font=card_label_font, fill=muted)
            display = value
            while draw.textbbox((0, 0), display, font=card_value_font)[2] > card_w - 40 and len(display) > 4:
                display = display[:-2] + "…"
            draw.text((x + 20, y + 52), display, font=card_value_font, fill=accent)

        max_value = max([max(int(r["inductions"]), int(r["bwg"])) for r in rows] or [1])
        max_value = max(1, max_value)
        chart_left = margin + 22
        chart_right = width - margin - 22
        chart_width = chart_right - chart_left

        if not rows:
            y = header_h + 18
            draw.rounded_rectangle((margin, y, width - margin, y + 92), radius=18, fill=panel)
            draw.text((margin + 22, y + 26), "Noch keine Daten für diesen Zeitraum.", font=name_font, fill=muted)

        for index, r in enumerate(rows):
            y = header_h + index * row_h
            row_bg = panel if index % 2 == 0 else panel_alt
            draw.rounded_rectangle((margin, y + 8, width - margin, y + row_h - 8), radius=20, fill=row_bg)

            name = str(r["display_name"])
            if len(name) > 30:
                name = name[:29] + "…"
            rank = str(r["rank_name"] or "")
            department = str(r["department"] or "")
            meta = " • ".join(part for part in (rank, department) if part)
            if len(meta) > 52:
                meta = meta[:51] + "…"

            e = int(r["inductions"])
            b = int(r["bwg"])
            activity = int(r["activity"])

            draw.text((chart_left, y + 24), f"{index + 1:02d}  {name}", font=name_font, fill=text)
            if meta:
                draw.text((chart_left + 48, y + 68), meta, font=meta_font, fill=muted)

            activity_text = f"Gesamt {activity}"
            activity_box = draw.textbbox((0, 0), activity_text, font=activity_font)
            activity_w = activity_box[2] - activity_box[0]
            draw.text((chart_right - activity_w, y + 28), activity_text, font=activity_font, fill=accent_total)

            bar_y1 = y + 112
            bar_y2 = y + 164
            bar_h = 34
            e_w = int(chart_width * e / max_value)
            b_w = int(chart_width * b / max_value)

            draw.rounded_rectangle((chart_left, bar_y1, chart_right, bar_y1 + bar_h), radius=14, fill=track)
            draw.rounded_rectangle((chart_left, bar_y2, chart_right, bar_y2 + bar_h), radius=14, fill=track)
            PersonnelService._rounded_bar(draw, (chart_left, bar_y1, chart_left + e_w, bar_y1 + bar_h), accent_e, 14)
            PersonnelService._rounded_bar(draw, (chart_left, bar_y2, chart_left + b_w, bar_y2 + bar_h), accent_b, 14)

            draw.text((chart_left + 12, bar_y1 + 2), f"Einweisungen  {e}", font=bar_label_font, fill=text)
            draw.text((chart_left + 12, bar_y2 + 2), f"BWG  {b}", font=bar_label_font, fill=text)

        footer_y = height - footer_h + 28
        draw.text((margin, footer_y), "Raspberry-Bot • MD Personalabteilung", font=footer_font, fill=muted)
        right = "Mobile Export"
        box = draw.textbbox((0, 0), right, font=footer_font)
        draw.text((width - margin - (box[2] - box[0]), footer_y), right, font=footer_font, fill=muted)

        buf = BytesIO()
        image.save(buf, "PNG", optimize=True)
        return buf.getvalue()
'''
          p.write_text(head + fn, encoding='utf-8')
      - name: Validate Python
        run: python -m py_compile services/personnel_v2.py
      - name: Commit and push
        run: |
          git config user.name 'InvalidKaro'
          git config user.email '76846752+InvalidKaro@users.noreply.github.com'
          git add services/personnel_v2.py
          git commit -m 'style: redesign personnel export for mobile readability'
          git push
