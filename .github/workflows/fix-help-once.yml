name: Fix Help Once

on:
  push:
    paths:
      - '.github/workflows/fix-help-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch help select callbacks
        shell: python
        run: |
          from pathlib import Path

          path = Path('cogs/core/help.py')
          text = path.read_text(encoding='utf-8')

          old = '''    async def callback(self, interaction: discord.Interaction) -> None:\n        assert isinstance(self.view, HelpView)\n        self.view.category_key = self.values[0]\n        self.view.page = 0\n        self.view.command_name = None\n        self.view.rebuild_components()\n\n        category = CATEGORY_BY_KEY[self.view.category_key]\n        await interaction.response.edit_message(\n            embed=build_category_embed(\n                self.view.bot,\n                category,\n                page=self.view.page,\n                user=interaction.user,\n            ),\n            view=self.view,\n        )\n'''
          new = '''    async def callback(self, interaction: discord.Interaction) -> None:\n        view = self.view\n        assert isinstance(view, HelpView)\n        view.category_key = self.values[0]\n        view.page = 0\n        view.command_name = None\n        view.rebuild_components()\n\n        category = CATEGORY_BY_KEY[view.category_key]\n        await interaction.response.edit_message(\n            embed=build_category_embed(\n                view.bot,\n                category,\n                page=view.page,\n                user=interaction.user,\n            ),\n            view=view,\n        )\n'''
          if old not in text:
              raise SystemExit('CategorySelect callback block not found')
          text = text.replace(old, new, 1)

          old = '''    async def callback(self, interaction: discord.Interaction) -> None:\n        assert isinstance(self.view, HelpView)\n\n        if self.values[0] == "__none__":\n            await interaction.response.defer()\n            return\n\n        command = _find_command(self.view.bot, self.values[0])\n        if command is None:\n            await interaction.response.send_message(\n                "That command is no longer registered. Re-open `/help` after syncing commands.",\n                ephemeral=True,\n            )\n            return\n\n        self.view.command_name = _qualified_name(command)\n        self.view.rebuild_components()\n\n        await interaction.response.edit_message(\n            embed=build_command_embed(command, user=interaction.user),\n            view=self.view,\n        )\n'''
          new = '''    async def callback(self, interaction: discord.Interaction) -> None:\n        view = self.view\n        assert isinstance(view, HelpView)\n\n        if self.values[0] == "__none__":\n            await interaction.response.defer()\n            return\n\n        command = _find_command(view.bot, self.values[0])\n        if command is None:\n            await interaction.response.send_message(\n                "That command is no longer registered. Re-open `/help` after syncing commands.",\n                ephemeral=True,\n            )\n            return\n\n        view.command_name = _qualified_name(command)\n        view.rebuild_components()\n\n        await interaction.response.edit_message(\n            embed=build_command_embed(command, user=interaction.user),\n            view=view,\n        )\n'''
          if old not in text:
              raise SystemExit('CommandSelect callback block not found')
          text = text.replace(old, new, 1)

          compile(text, str(path), 'exec')
          path.write_text(text, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "InvalidKaro"
          git config user.email "76846752+InvalidKaro@users.noreply.github.com"
          git add cogs/core/help.py
          git commit -m "fix: keep help view reference during component rebuild"
          git push
