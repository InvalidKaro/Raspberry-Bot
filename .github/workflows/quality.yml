name: Quality

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-display.txt
      - run: pip install -r requirements-meshtastic.txt
      - run: pip check
      - run: python -m compileall -q .
      - run: python scripts/import_smoke.py
      - run: python scripts/command_hub_smoke.py
      - run: python scripts/control_center_architecture_smoke.py
      - run: python scripts/dashboard_smoke.py
      - run: python scripts/mdplan_smoke.py
      - run: python scripts/feature_flags_smoke.py
      - run: python scripts/display_smoke.py
      - run: python scripts/display2_smoke.py
      - run: python scripts/meshtastic_smoke.py
      - run: python scripts/homepi_intelligence_smoke.py
      - run: python scripts/voice_control_smoke.py
      - run: python scripts/smart_home_smoke.py
      - run: python scripts/universal_devices_smoke.py
      - run: python scripts/phone_alerts_smoke.py
      - run: python scripts/phone_assistant_smoke.py
      - run: python scripts/homepi_alertctl.py --help
      - name: Privileged helper rejects unknown units
        run: |
          if python scripts/homepi_systemctl.py status definitely-not-a-real-service; then
            echo "homepi-systemctl unexpectedly accepted an unknown unit" >&2
            exit 1
          fi
      - run: python scripts/prune_homepi_blackbox.py --database /tmp/no-homepi-blackbox.sqlite3 --dry-run
      - run: bash -n scripts/install_display_service.sh
      - run: bash -n scripts/install_display2_service.sh
      - run: bash -n scripts/install_meshtastic_service.sh
      - run: bash -n scripts/install_voice_control.sh
      - run: bash -n scripts/install_homepi_intelligence.sh
      - run: bash -n scripts/install_homepi_alerts.sh

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip pip-audit
      - name: Audit production dependencies
        # PYSEC-2026-2132 is click 8.1.8 pulled by gTTS 2.5.x, which currently
        # constrains click<8.2. HomePi imports gTTS as a library and does not
        # execute the vulnerable Click CLI surface. Keep this single explicit
        # exception visible until gTTS releases a compatible dependency range.
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-2132
