name: HomePi VPN checks
on:
  push:
    branches: [feature/homepi-vpn]
  pull_request:
    paths:
      - "services/homepi_vpn*"
      - "dashboard/homepi_vpn_routes.py"
      - "dashboard/templates/vpn.html"
      - "dashboard/static/vpn.*"
      - "cogs/management/homepi_vpn.py"
      - "tests/test_homepi_vpn*"
      - ".github/workflows/homepi-vpn.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vpn:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile changed Python modules
        run: |
          python -m compileall -q services/homepi_vpn.py services/homepi_vpn_proxy.py dashboard/homepi_vpn_routes.py dashboard/app.py cogs/management/homepi_vpn.py
      - name: Test read-only diagnostics and isolated proxy controller
        run: python -m pytest -q tests/test_homepi_vpn.py tests/test_homepi_vpn_proxy.py
