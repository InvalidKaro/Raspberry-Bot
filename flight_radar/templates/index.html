<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07110f">
  <title>HomePi Flight Radar</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--bg:#050908;--panel:rgba(8,18,16,.92);--panel2:rgba(10,25,21,.82);--line:rgba(116,255,211,.15);--green:#78ffd2;--green2:#2ee6aa;--text:#ecfff8;--muted:#8ba79d;--warn:#ffca68;--danger:#ff6b7a;--shadow:0 24px 80px rgba(0,0,0,.42)}
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(45,230,170,.07),transparent 42%),linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:auto,32px 32px,32px 32px;z-index:9999;mix-blend-mode:screen}
    #map{position:absolute;inset:0;background:#06100e}.leaflet-container{background:#06100e}.leaflet-tile{filter:saturate(.65) brightness(.55) contrast(1.18) hue-rotate(105deg)}.leaflet-control-zoom a{background:#091713!important;color:var(--green)!important;border-color:var(--line)!important}.leaflet-control-attribution{background:rgba(3,10,8,.75)!important;color:#6f877f!important}.leaflet-control-attribution a{color:#86bfae!important}
    .topbar{position:fixed;left:22px;right:22px;top:max(18px,env(safe-area-inset-top));height:74px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 18px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(12,28,24,.94),rgba(5,14,12,.88));backdrop-filter:blur(18px);border-radius:18px;box-shadow:var(--shadow);z-index:800}
    .brand{display:flex;align-items:center;gap:13px}.logo{width:42px;height:42px;border:1px solid rgba(120,255,210,.45);border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 24px rgba(46,230,170,.12),0 0 25px rgba(46,230,170,.08);font-size:19px}.eyebrow{margin:0 0 2px;font-size:10px;letter-spacing:.22em;color:var(--green);font-weight:800}.brand h1{margin:0;font-size:18px;letter-spacing:.01em}.statusrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.pill{border:1px solid var(--line);background:rgba(5,15,12,.75);border-radius:999px;padding:8px 11px;font-size:11px;color:var(--muted);white-space:nowrap}.pill strong{color:var(--text);font-weight:700}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green2);box-shadow:0 0 10px var(--green2);margin-right:7px}
    .side{position:fixed;z-index:800;left:22px;top:110px;bottom:22px;width:320px;display:flex;flex-direction:column;gap:12px;pointer-events:none}.card{pointer-events:auto;border:1px solid var(--line);background:linear-gradient(180deg,rgba(10,24,21,.94),rgba(5,14,12,.91));backdrop-filter:blur(16px);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.stats{display:grid;grid-template-columns:1fr 1fr}.stat{padding:16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.stat:nth-child(even){border-right:0}.stat:nth-last-child(-n+2){border-bottom:0}.stat span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.12em}.stat strong{display:block;margin-top:5px;font-size:20px;font-weight:650}.controls{padding:14px}.label{font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.seg button,.ghost{appearance:none;border:1px solid var(--line);background:rgba(8,20,17,.7);color:var(--muted);padding:9px 8px;border-radius:10px;font:inherit;font-size:11px;cursor:pointer}.seg button.active,.seg button:hover,.ghost:hover{color:#07110f;background:var(--green);border-color:var(--green)}.search{display:flex;gap:7px;margin-top:12px}.search input{width:100%;background:rgba(4,12,10,.8);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 11px;outline:none}.search input:focus{border-color:rgba(120,255,210,.5)}
    .listcard{min-height:0;display:flex;flex-direction:column;flex:1}.listhead{padding:14px 14px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.listhead h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0}.airlist{overflow:auto;min-height:0}.airrow{padding:12px 14px;border-bottom:1px solid rgba(116,255,211,.08);cursor:pointer;transition:.18s}.airrow:hover,.airrow.active{background:rgba(120,255,210,.07)}.airtop{display:flex;justify-content:space-between;gap:10px}.callsign{font-weight:750;letter-spacing:.06em}.type{font-size:11px;color:var(--green)}.airmeta{display:flex;gap:10px;margin-top:5px;color:var(--muted);font-size:10px}.empty{padding:22px 14px;color:var(--muted);font-size:12px}.airlist::-webkit-scrollbar{width:6px}.airlist::-webkit-scrollbar-thumb{background:rgba(120,255,210,.18);border-radius:6px}
    .detail{position:fixed;z-index:800;right:22px;top:110px;width:330px;max-height:calc(100vh - 132px);overflow:auto;border:1px solid var(--line);background:linear-gradient(180deg,rgba(10,24,21,.96),rgba(5,14,12,.94));backdrop-filter:blur(18px);border-radius:18px;box-shadow:var(--shadow);display:none}.detail.show{display:block}.detailhero{padding:18px;border-bottom:1px solid var(--line)}.detailhero .planeicon{font-size:26px;color:var(--green);transform:rotate(45deg);display:inline-block}.detailhero h2{margin:8px 0 2px;font-size:26px;letter-spacing:.05em}.detailhero p{margin:0;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr}.kv{padding:12px 14px;border-bottom:1px solid rgba(116,255,211,.08)}.kv:nth-child(odd){border-right:1px solid rgba(116,255,211,.08)}.kv span{display:block;color:var(--muted);font-size:9px;letter-spacing:.12em;text-transform:uppercase}.kv strong{display:block;margin-top:4px;font-size:13px}.detailfoot{padding:14px;color:var(--muted);font-size:10px;line-height:1.5}
    .radar-overlay{position:absolute;z-index:500;pointer-events:none;left:50%;top:50%;width:min(65vw,820px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;opacity:.36;background:repeating-radial-gradient(circle,transparent 0 19.7%,rgba(92,255,205,.17) 20%,transparent 20.3%),linear-gradient(90deg,transparent 49.85%,rgba(92,255,205,.13) 50%,transparent 50.15%),linear-gradient(transparent 49.85%,rgba(92,255,205,.13) 50%,transparent 50.15%)}.radar-overlay:after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 315deg,rgba(90,255,204,.02) 325deg,rgba(90,255,204,.20) 359deg,transparent 360deg);animation:sweep 7s linear infinite;transform-origin:center}@keyframes sweep{to{transform:rotate(360deg)}}
    .plane-marker{width:26px;height:26px;display:grid;place-items:center;filter:drop-shadow(0 0 7px rgba(120,255,210,.4));transition:transform .25s}.plane-marker svg{width:23px;height:23px;fill:#8effd9;stroke:#06100e;stroke-width:.5}.plane-marker.emergency svg{fill:var(--danger);filter:drop-shadow(0 0 8px var(--danger))}.plane-label{position:absolute;left:27px;top:3px;background:rgba(3,11,9,.8);border:1px solid rgba(120,255,210,.16);border-radius:6px;padding:3px 5px;color:#dffcf3;font-size:9px;white-space:nowrap;letter-spacing:.05em}
    .toast{position:fixed;left:50%;bottom:25px;z-index:1000;transform:translateX(-50%);padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(6,16,13,.94);color:var(--muted);font-size:11px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
    @media(max-width:900px){.topbar{left:10px;right:10px;top:10px;height:64px}.brand h1{font-size:15px}.statusrow .pill:nth-child(n+3){display:none}.side{left:10px;right:10px;top:auto;bottom:10px;width:auto;height:220px;display:grid;grid-template-columns:160px 1fr}.stats{grid-template-columns:1fr}.stat{padding:9px 11px!important;border-right:0!important}.stat:nth-last-child(-n+2){border-bottom:1px solid var(--line)}.stat:last-child{border-bottom:0}.controls{display:none}.listcard{height:220px}.detail{left:10px;right:10px;top:84px;width:auto;max-height:calc(100vh - 324px)}.radar-overlay{width:90vw}}
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="radar-overlay"></div>

  <header class="topbar">
    <div class="brand"><div class="logo">⌁</div><div><p class="eyebrow">HOMEPI • LIVE AIRSPACE</p><h1>Flight Radar</h1></div></div>
    <div class="statusrow"><span class="pill"><i class="dot"></i><strong id="liveState">LIVE</strong></span><span class="pill">Quelle <strong id="source">—</strong></span><span class="pill">Update <strong id="updated">—</strong></span><span class="pill">Bereich <strong id="radiusLabel">120 NM</strong></span></div>
  </header>

  <aside class="side">
    <section class="card stats"><div class="stat"><span>Flugzeuge</span><strong id="count">—</strong></div><div class="stat"><span>In Luft</span><strong id="airborne">—</strong></div><div class="stat"><span>Ø Höhe</span><strong id="avgAlt">—</strong></div><div class="stat"><span>Notfall</span><strong id="emergency">0</strong></div></section>
    <section class="card controls"><div class="label">Radar-Reichweite</div><div class="seg"><button data-radius="50">50</button><button data-radius="100">100</button><button class="active" data-radius="120">120</button><button data-radius="250">250 NM</button></div><div class="search"><input id="search" type="search" placeholder="Callsign, Kennung, Typ…"><button class="ghost" id="locate" title="Karte auf Ausgangspunkt">⌖</button></div></section>
    <section class="card listcard"><div class="listhead"><h2>Traffic</h2><span class="pill" id="visibleCount">0 sichtbar</span></div><div class="airlist" id="airlist"><div class="empty">Lade Live-Daten…</div></div></section>
  </aside>

  <aside class="detail" id="detail"><div class="detailhero"><span class="planeicon">✈</span><h2 id="dFlight">—</h2><p id="dSubtitle">—</p></div><div class="grid" id="detailGrid"></div><div class="detailfoot">Positionsdaten stammen aus öffentlich empfangenen ADS-B/MLAT-Daten. Nicht jedes reale Luftfahrzeug ist jederzeit sichtbar.</div></aside>
  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const HOME={lat:49.8917,lon:10.8868,zoom:8};
    const map=L.map('map',{zoomControl:false,preferCanvas:true,minZoom:3}).setView([HOME.lat,HOME.lon],HOME.zoom);
    L.control.zoom({position:'bottomright'}).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,attribution:'© OpenStreetMap © CARTO'}).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,pane:'overlayPane',opacity:.68}).addTo(map);

    const markers=new Map(); let aircraft=[]; let selected=null; let radius=120; let timer=null; let loading=false;
    const $=id=>document.getElementById(id); const fmt=(v,s='—')=>v===null||v===undefined||v===''?s:v;
    const n=(v,d=0)=>typeof v==='number'&&Number.isFinite(v)?v:d;
    function planeIcon(a){const angle=n(a.track,n(a.true_heading,0));const emergency=['7500','7600','7700'].includes(String(a.squawk||''))||a.emergency&&a.emergency!=='none';const label=(a.flight||a.registration||a.hex||'').trim();return L.divIcon({className:'',iconSize:[28,28],iconAnchor:[14,14],html:`<div class="plane-marker ${emergency?'emergency':''}" style="transform:rotate(${angle}deg)"><svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>${map.getZoom()>=8&&label?`<span class="plane-label" style="transform:rotate(${-angle}deg)">${label}</span>`:''}</div>`});}
    function toast(text){$('toast').textContent=text;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2300)}
    function feet(v){return typeof v==='number'?Math.round(v).toLocaleString('de-DE')+' ft':fmt(v)} function knots(v){return typeof v==='number'?Math.round(v)+' kt':fmt(v)}
    function detail(a){selected=a.hex||a.flight;$('detail').classList.add('show');$('dFlight').textContent=a.flight||a.registration||a.hex||'Unbekannt';$('dSubtitle').textContent=[a.registration,a.type,a.description].filter(Boolean).join(' • ')||'Keine Stammdaten';const rows=[['ICAO',a.hex],['Squawk',a.squawk],['Baro Höhe',feet(a.alt_baro)],['Geom. Höhe',feet(a.alt_geom)],['Groundspeed',knots(a.ground_speed)],['Kurs',typeof a.track==='number'?Math.round(a.track)+'°':a.track],['Steig/Sinkrate',typeof a.baro_rate==='number'?Math.round(a.baro_rate)+' ft/min':a.baro_rate],['Nav. Zielhöhe',feet(a.nav_altitude_mcp||a.nav_altitude_fms)],['IAS',knots(a.ias)],['TAS',knots(a.tas)],['Mach',a.mach],['Kategorie',a.category],['Quelle',a.source],['Letztes Signal',typeof a.seen==='number'?a.seen.toFixed(1)+' s':a.seen]];$('detailGrid').innerHTML=rows.map(([k,v])=>`<div class="kv"><span>${k}</span><strong>${fmt(v)}</strong></div>`).join('');}
    function updateStats(list){$('count').textContent=list.length;const airborne=list.filter(a=>a.alt_baro!=='ground').length;$('airborne').textContent=airborne;const alts=list.map(a=>typeof a.alt_baro==='number'?a.alt_baro:null).filter(v=>v!==null);$('avgAlt').textContent=alts.length?Math.round(alts.reduce((a,b)=>a+b,0)/alts.length/100)*100+' ft':'—';$('emergency').textContent=list.filter(a=>['7500','7600','7700'].includes(String(a.squawk||''))).length;}
    function render(){const q=$('search').value.trim().toLowerCase();const list=aircraft.filter(a=>!q||[a.flight,a.registration,a.type,a.description,a.hex].some(v=>String(v||'').toLowerCase().includes(q)));$('visibleCount').textContent=list.length+' sichtbar';const ids=new Set(list.map(a=>a.hex||`${a.lat},${a.lon}`));for(const [id,m] of markers)if(!ids.has(id)){map.removeLayer(m);markers.delete(id)}for(const a of list){const id=a.hex||`${a.lat},${a.lon}`;let m=markers.get(id);if(!m){m=L.marker([a.lat,a.lon],{icon:planeIcon(a),zIndexOffset:300}).addTo(map).on('click',()=>detail(a));markers.set(id,m)}else{m.setLatLng([a.lat,a.lon]);m.setIcon(planeIcon(a));m.off('click').on('click',()=>detail(a))}}
      const sorted=[...list].sort((a,b)=>n(a.seen,99)-n(b.seen,99));$('airlist').innerHTML=sorted.length?sorted.slice(0,180).map(a=>`<div class="airrow ${selected&&(a.hex===selected||a.flight===selected)?'active':''}" data-id="${a.hex||''}"><div class="airtop"><span class="callsign">${a.flight||a.registration||a.hex||'UNKNOWN'}</span><span class="type">${a.type||'—'}</span></div><div class="airmeta"><span>${feet(a.alt_baro)}</span><span>${knots(a.ground_speed)}</span><span>${typeof a.track==='number'?Math.round(a.track)+'°':'—'}</span></div></div>`).join(''):'<div class="empty">Keine passenden Flugzeuge in diesem Bereich.</div>';
      document.querySelectorAll('.airrow').forEach(el=>el.onclick=()=>{const a=list.find(x=>x.hex===el.dataset.id);if(a){detail(a);map.panTo([a.lat,a.lon])}});updateStats(list);
    }
    async function load(){if(loading)return;loading=true;$('liveState').textContent='SYNC';const c=map.getCenter();try{const r=await fetch(`/api/aircraft?lat=${c.lat.toFixed(5)}&lon=${c.lng.toFixed(5)}&radius=${radius}`,{cache:'no-store'});const data=await r.json();if(!data.ok)throw new Error(data.message||'API error');aircraft=data.aircraft||[];$('source').textContent=data.source;$('updated').textContent=new Date((data.generated_at||Date.now()/1000)*1000).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('liveState').textContent='LIVE';render()}catch(e){$('liveState').textContent='OFFLINE';toast('Live-Daten momentan nicht erreichbar')}finally{loading=false}}
    function schedule(){clearTimeout(timer);timer=setTimeout(load,350)}
    document.querySelectorAll('[data-radius]').forEach(b=>b.onclick=()=>{radius=Number(b.dataset.radius);document.querySelectorAll('[data-radius]').forEach(x=>x.classList.toggle('active',x===b));$('radiusLabel').textContent=radius+' NM';load()});
    $('search').addEventListener('input',render);$('locate').onclick=()=>map.setView([HOME.lat,HOME.lon],HOME.zoom);map.on('moveend',schedule);map.on('zoomend',render);setInterval(load,7000);load();
  </script>
</body>
</html>
