<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomePi Status</title><style>:root{color-scheme:dark;--bg:#070a0f;--panel:#10161e;--line:#26303d;--text:#f1f5f9;--muted:#94a3b8;--green:#31c48d;--yellow:#f6b94a;--red:#ef5b67}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#152321,transparent 30%),var(--bg);font:15px/1.5 Inter,system-ui,sans-serif;color:var(--text)}main{max-width:820px;margin:0 auto;padding:50px 18px}.head{text-align:center;margin-bottom:25px}.logo{font-size:34px;font-weight:900;letter-spacing:-.05em}.muted{color:var(--muted)}.overall{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:20px;text-align:center;margin-bottom:15px}.overall h1{margin:8px 0 4px;font-size:28px}.dot{width:13px;height:13px;border-radius:50%;display:inline-block;background:var(--green);box-shadow:0 0 18px rgba(49,196,141,.35)}.dot.warn{background:var(--yellow)}.dot.bad{background:var(--red)}.services{display:grid;gap:8px}.service{display:flex;justify-content:space-between;align-items:center;padding:14px 15px;border:1px solid var(--line);border-radius:12px;background:#0d131b}.pill{font-size:12px;padding:4px 8px;border-radius:999px;background:rgba(49,196,141,.12);color:#7ce1bd}.pill.bad{background:rgba(239,91,103,.12);color:#ff9ca5}.foot{margin-top:22px;text-align:center;font-size:12px;color:var(--muted)}</style></head><body><main><div class="head"><div class="logo">⌁ HomePi Status</div><p class="muted">Öffentliche, reduzierte Statusansicht ohne Admin- oder Serverdaten.</p></div><section class="overall"><span id="dot" class="dot"></span><h1 id="status">Status wird geladen …</h1><div id="uptime" class="muted">—</div></section><div id="services" class="services"></div><div class="foot"><span id="updated">—</span> · Aktualisierung alle 60 Sekunden</div></main><script>const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dur=s=>{s=Number(s||0);const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+' Tage ':'')+(h?h+' Std. ':'')+m+' Min.'};async function refresh(){try{const r=await fetch('/api/public/status',{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error('Status nicht verfügbar');const ok=d.status==='operational';$('#dot').className='dot '+(ok?'':'warn');$('#status').textContent=ok?'Alle Kernsysteme betriebsbereit':'Eingeschränkter Betrieb';$('#uptime').textContent='Host-Uptime: '+dur(d.uptime_seconds);$('#services').innerHTML=(d.services||[]).map(s=>`<div class="service"><b>${esc(s.name)}</b><span class="pill ${s.online?'':'bad'}">${s.online?'Online':'Offline'}</span></div>`).join('');$('#updated').textContent='Zuletzt geprüft: '+new Date(d.updated_at).toLocaleString('de-DE')}catch(e){$('#dot').className='dot bad';$('#status').textContent='Status derzeit nicht abrufbar';$('#uptime').textContent=e.message}}refresh();setInterval(refresh,60000)</script></body></html>
