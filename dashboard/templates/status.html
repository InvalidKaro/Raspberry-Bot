<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070a0f">
  <title>HomePi Status</title>
  <link rel="stylesheet" href="/static/status.css">
</head>
<body>
  <main>
    <header class="head">
      <div class="logo">⌁ HomePi Status</div>
      <p class="muted">Öffentliche, reduzierte Statusansicht ohne Admin- oder Serverdaten.</p>
    </header>

    <section class="overall" aria-live="polite">
      <span id="dot" class="dot" aria-hidden="true"></span>
      <h1 id="status">Status wird geladen …</h1>
      <div id="uptime" class="muted">—</div>
    </section>

    <section id="services" class="services" aria-label="Service-Status"></section>
    <footer class="foot"><span id="updated">—</span> · Aktualisierung alle 60 Sekunden</footer>
  </main>
  <script src="/static/status.js"></script>
</body>
</html>
