<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HomePi Now Playing</title>
<style>
:root{color-scheme:dark;--bg:#06080c;--panel:rgba(15,20,28,.86);--line:#28313e;--text:#f3f6fb;--muted:#9aa6b7;--accent:#8b5cf6;--red:#ef4444}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 30% 12%,#211537 0,transparent 32%),linear-gradient(145deg,#080b11,#030508);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:22px;gap:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;font-size:18px}.controls-top{display:flex;gap:8px;align-items:center}.controls-top select,.controls-top a{background:#101620;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 11px;text-decoration:none}.main{display:grid;grid-template-columns:minmax(280px,520px) minmax(300px,1fr);gap:30px;align-items:center;max-width:1400px;width:100%;margin:auto}.cover-wrap{position:relative}.cover{width:100%;aspect-ratio:1;border-radius:28px;object-fit:cover;background:linear-gradient(135deg,#1a2130,#0c1119);box-shadow:0 35px 100px rgba(0,0,0,.48)}.badge{position:absolute;left:16px;bottom:16px;background:rgba(0,0,0,.68);backdrop-filter:blur(8px);padding:7px 10px;border-radius:999px;font-size:12px}.info h1{font-size:clamp(30px,5vw,72px);line-height:1.05;letter-spacing:-.055em;margin:0 0 12px;max-width:980px}.meta{font-size:clamp(15px,2vw,22px);color:var(--muted);margin-bottom:24px}.progress{height:8px;border-radius:999px;background:#232a34;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#8b5cf6,#d946ef);transition:width .5s linear}.times{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:7px}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.buttons button{border:0;border-radius:14px;background:#1a2230;color:white;padding:13px 17px;font:inherit;font-weight:750;cursor:pointer}.buttons button.primary{background:var(--accent)}.buttons button.danger{background:#7f2631}.volume{display:flex;align-items:center;gap:10px;margin-top:16px}.volume input{width:min(360px,70%)}.queue{max-height:32vh;overflow:auto;display:grid;gap:7px;margin-top:24px}.item{background:rgba(15,20,28,.78);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center}.item small{color:var(--muted)}.foot{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px}.offline{display:none;position:fixed;inset:0;background:rgba(3,5,8,.9);z-index:20;place-items:center;text-align:center;padding:20px}.offline.show{display:grid}.offline h2{font-size:34px;margin:0 0 7px}@media(max-width:820px){.shell{padding:14px}.main{grid-template-columns:1fr;gap:18px}.cover{max-height:46vh;object-fit:contain}.info h1{font-size:36px}.queue{max-height:24vh}.top{align-items:flex-start}.controls-top{flex-wrap:wrap;justify-content:flex-end}}
</style>
</head>
<body>
<div class="shell"><div class="top"><div class="brand">🎵 HomePi Now Playing</div><div class="controls-top"><select id="guild"><option value="">Server wählen …</option></select><a href="/ops#media">Dashboard Pro</a></div></div><div class="main"><div class="cover-wrap"><img id="cover" class="cover" alt="Cover"><div id="kind" class="badge">Voice</div></div><div class="info"><h1 id="title">Nichts läuft</h1><div id="meta" class="meta">Kein Voice-Channel</div><div class="progress"><div id="bar" class="bar"></div></div><div class="times"><span id="elapsed">0:00</span><span id="duration">—</span></div><div class="buttons"><button onclick="act('pause')">⏸ Pause</button><button class="primary" onclick="act('resume')">▶ Resume</button><button onclick="act('skip')">⏭ Skip</button><button class="danger" onclick="act('stop')">⏹ Stop</button></div><div class="volume"><span>🔊</span><input id="volume" type="range" min="10" max="120" value="65"><span id="volumeText">65%</span><button onclick="act('volume')" style="border:0;border-radius:9px;background:#232c39;color:white;padding:8px 10px">Set</button></div><div id="queue" class="queue"></div></div></div><div class="foot"><span id="updated">—</span><span>Auto-Refresh 4s · Pi-friendly</span></div></div><div id="offline" class="offline"><div><h2>Keine aktive Wiedergabe</h2><p>Starte Audio im Media Center oder über Discord.</p></div></div>
<script>
let csrf='',gid='',last=null,timer=null;const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opts={}){const r=await fetch(url,opts);const d=await r.json().catch(()=>({ok:false,message:'Ungültige Antwort'}));if(!r.ok||d.ok===false)throw new Error(d.message||`HTTP ${r.status}`);return d}async function post(url,data){return api(url,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(data)})}
function fmt(s){s=Math.max(0,Number(s||0));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=Math.floor(s%60);return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`}
async function boot(){const b=await api('/api/bootstrap');csrf=b.csrf;const g=await api('/api/discord/guilds');for(const item of g.guilds||[]){const o=document.createElement('option');o.value=item.id;o.textContent=item.name;$('#guild').appendChild(o)}if((g.guilds||[]).length===1){$('#guild').value=g.guilds[0].id;gid=$('#guild').value;refresh()}$('#guild').onchange=()=>{gid=$('#guild').value;refresh()};timer=setInterval(refresh,4000);setInterval(tick,1000)}
async function refresh(){if(!gid)return;try{const d=await api('/api/ops/media?guild_id='+gid);last=d;render()}catch(e){$('#updated').textContent=e.message}}
function render(){const r=last?.runtime||{},v=r.voice||{},y=r.youtube||{},cur=y.current||null;const active=!!(v.connected&&(v.playing||v.paused||cur));$('#offline').classList.toggle('show',!active);$('#title').textContent=cur?.title||v.title||'Nichts läuft';$('#meta').textContent=[v.channel_name,v.kind,`${v.volume??65}%`].filter(Boolean).join(' · ')||'Kein Voice-Channel';$('#kind').textContent=v.paused?'⏸ Paused':v.kind||'Voice';$('#volume').value=v.volume??65;$('#volumeText').textContent=(v.volume??65)+'%';if(r.youtube_thumbnail){$('#cover').src=r.youtube_thumbnail;$('#cover').style.visibility='visible'}else{$('#cover').removeAttribute('src');$('#cover').style.visibility='visible'}const q=y.queue||[];$('#queue').innerHTML=q.map((x,i)=>`<div class="item"><b>${i+1}</b><div><strong>${esc(x.title)}</strong><br><small>${x.duration?fmt(x.duration):'Live/Unbekannt'}</small></div><small>${esc(x.requested_by||'')}</small></div>`).join('')||'<div class="item"><span>—</span><div><strong>Queue leer</strong></div></div>';$('#updated').textContent='Aktualisiert '+new Date().toLocaleTimeString('de-DE');tick()}
function tick(){if(!last)return;const r=last.runtime||{},v=r.voice||{},cur=(r.youtube||{}).current||{},base=Number(v.elapsed_seconds||0),age=r.updated_at?Math.max(0,(Date.now()-new Date(String(r.updated_at).replace(' ','T')+'Z').getTime())/1000):0,elapsed=base+(v.playing&&!v.paused?age:0),duration=Number(cur.duration||0);$('#elapsed').textContent=fmt(elapsed);$('#duration').textContent=duration?fmt(duration):'—';$('#bar').style.width=duration?Math.min(100,elapsed/duration*100)+'%':'0%'}
async function act(action){if(!gid)return;try{await post('/api/ops/media/action',{guild_id:gid,action,volume:Number($('#volume').value||65)});setTimeout(refresh,2200)}catch(e){alert(e.message)}}$('#volume').oninput=()=>$('#volumeText').textContent=$('#volume').value+'%';boot().catch(e=>$('#updated').textContent=e.message);
</script>
</body></html>
