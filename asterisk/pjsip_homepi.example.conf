; HomePi outbound-only PJSIP example.
; Copy/adapt this into /etc/asterisk/pjsip.conf or include it from there.
; Provider names, domains, usernames and passwords are placeholders.
; Follow your SIP provider's own PJSIP requirements where they differ.

[homepi-provider-auth]
type=auth
auth_type=userpass
username=YOUR_SIP_USERNAME
password=YOUR_SIP_PASSWORD

[homepi-provider-aor]
type=aor
contact=sip:sip.example.invalid

[homepi-provider]
type=endpoint
transport=transport-udp
context=default
disallow=all
allow=alaw
allow=ulaw
outbound_auth=homepi-provider-auth
aors=homepi-provider-aor
from_user=YOUR_SIP_USERNAME
from_domain=sip.example.invalid
direct_media=no
rewrite_contact=yes
rtp_symmetric=yes
force_rport=yes

[homepi-provider-registration]
type=registration
transport=transport-udp
outbound_auth=homepi-provider-auth
server_uri=sip:sip.example.invalid
client_uri=sip:YOUR_SIP_USERNAME@sip.example.invalid
contact_user=YOUR_SIP_USERNAME
retry_interval=30
forbidden_retry_interval=300
max_retries=20
